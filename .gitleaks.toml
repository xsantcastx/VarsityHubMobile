# gitleaks configuration for VarsityHub Mobile
#
# Block secrets at commit time + on PRs. The default ruleset already
# catches most cloud-provider keys, JWTs, and high-entropy strings.
# This file only adds repo-specific allowlists for values we've
# deliberately tracked in source.

title = "VarsityHub Mobile gitleaks config"

[extend]
# Use built-in default ruleset (Stripe, AWS, GCP, Slack, JWT, etc.).
useDefault = true

[allowlist]
description = "Repo-specific public values that look like secrets but aren't"

# Files where false-positives are common
paths = [
  '''^server/prisma/migrations/''',  # SQL migration files often contain UUIDs
  '''^.*\.lock$''',                  # package-lock.json / yarn.lock
  '''^\.gitleaks\.toml$''',          # this file
  '''^docs/security/scrub-secrets-from-history\.md$''',  # discusses leaked SHAs
]

# Specific values that are PUBLIC by design — embedded in mobile bundles
# anyway. Allowlisted as regexes against the matched secret string.
regexes = [
  # Google OAuth client IDs (tracked in eas.json + app.config.js — these
  # are PUBLIC: they're shipped inside every app binary).
  '''514463516787-[a-z0-9]+\.apps\.googleusercontent\.com''',
  # Sentry DSN — write-only token, embedded in every mobile binary.
  '''https://dba14af58de85862ac7f1cb132e19ff5@o4510445730070528\.ingest\.us\.sentry\.io/4510445740687360''',
]

# Keys that must NEVER be re-committed — rotated or moved to EAS secrets.
# If gitleaks ever sees these, it should flag them as violations:
#   AIzaSyDhct-4heIbBF1w9l_64SC8VafmyQWWQlg  (Maps key — rotated Apr 2026)
#   AIzaSyCWTjN0GPyMnzwz06JKQ1ndqqu10DvNkZA  (Maps key — rotated Apr 2026)
#   phc_8y7VeTkwQftyHVGWTGxx11UAZO8ng4RigcbH82yzjQ1  (PostHog — moved to EAS secret)
#   sanchezemil82@gmail.com  (Apple ID — moved to EXPO_APPLE_ID env var)
#   B5H8F69RW5  (Apple Team ID — moved to EXPO_APPLE_TEAM_ID env var)
