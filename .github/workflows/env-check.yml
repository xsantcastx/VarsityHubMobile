name: Env Alignment Check

on:
  workflow_dispatch:
  push:
    paths:
      - .env
      - server/.env
      - scripts/check-env-alignment.js
      - .github/workflows/env-check.yml

jobs:
  check-env:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node setup
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Run alignment script
        run: node scripts/check-env-alignment.js
