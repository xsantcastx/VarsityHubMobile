name: Check story posters

# READ-ONLY. Reports poster_url status for recent stories to verify server-side
# poster generation. Runs on workflow_dispatch or a push to main that changes
# THIS file. Needs PRODUCTION_DATABASE_URL.
# Re-run 2026-07-16 20:40Z: added Day 1 game-scoped poster report.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/check-story-posters.yml'

jobs:
  check:
    name: check-story-posters
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json
      - name: Install server dependencies
        working-directory: server
        run: npm ci
      - name: Generate Prisma client
        working-directory: server
        run: npx prisma generate
      - name: Check posters
        working-directory: server
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
        run: npx tsx scripts/check-story-posters.ts
