name: Restore Fanatics Day 1 start time

# One-shot: sets Day 1's start back to 1:00 PM EDT (17:00 UTC). Runs on
# workflow_dispatch or a push to main that changes THIS file. Idempotent.
# Requires PRODUCTION_DATABASE_URL.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/restore-fanatics-day1-date.yml'

jobs:
  restore:
    name: restore-fanatics-day1-date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json
      - name: Install server dependencies
        working-directory: server
        run: npm ci
      - name: Generate Prisma client
        working-directory: server
        run: npx prisma generate
      - name: Restore Day 1 date
        working-directory: server
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
        run: npx tsx scripts/restore-fanatics-day1-date.ts
