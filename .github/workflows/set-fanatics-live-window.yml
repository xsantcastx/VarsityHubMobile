name: Set Fanatics Fest live posting window

# Manually-triggered, idempotent prod write. Sets the 18-hour geofenced live
# posting window on the four Fanatics Fest NYC 2026 day events so fans at the
# Javits Center can make geofenced posts all day (owner rule 2026-07-15).
# The script only touches those 4 event rows, prints before/after, and
# verifies. Requires the PRODUCTION_DATABASE_URL secret (same one the
# diagnose-fanatics-fest workflow uses).
#
# Runs on workflow_dispatch, or on a push to main that changes THIS file
# (scoped one-shot trigger — it never fires on unrelated pushes). Idempotent,
# so an accidental re-run just re-sets the same 18h value on the same 4 rows.
#
# Re-run 2026-07-17: re-assert the 18h window during the fest so a live day's
# "Add Story"/posting stays open all day (a 3h default would close it ~3h in).

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/set-fanatics-live-window.yml'

jobs:
  set-window:
    name: set-fanatics-live-window
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json
      - name: Install server dependencies
        working-directory: server
        run: npm ci
      - name: Generate Prisma client
        working-directory: server
        run: npx prisma generate
      - name: Set live window
        working-directory: server
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
        run: npx tsx scripts/set-fanatics-live-window.ts
