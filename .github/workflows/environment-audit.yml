name: Environment Audit

on:
  workflow_dispatch:
  schedule:
    # Weekly on Monday at 9 AM UTC
    - cron: '0 9 * * 1'

jobs:
  audit-env:
    name: Verify Production Secrets
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v6

      - name: Check mobile app secrets
        id: mobile
        run: |
          echo "## Mobile App Environment Variables" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          required_vars=(
            "EXPO_PUBLIC_API_URL"
            "EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID"
            "EXPO_PUBLIC_GOOGLE_ANDROID_CLIENT_ID"
            "EXPO_PUBLIC_STRIPE_PUBLISHABLE_KEY"
          )
          
          missing=0
          for var in "${required_vars[@]}"; do
            if [ -z "${!var}" ]; then
              echo "- ❌ \`$var\` is missing" >> $GITHUB_STEP_SUMMARY
              missing=$((missing + 1))
            else
              echo "- ✅ \`$var\` is set" >> $GITHUB_STEP_SUMMARY
            fi
          done
          
          echo "missing=$missing" >> $GITHUB_OUTPUT

      - name: Check Railway secrets
        id: railway
        env:
          # Use GitHub secrets that mirror Railway env vars
          DATABASE_URL: ${{ secrets.RAILWAY_DATABASE_URL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
        run: |
          echo "## Railway Production Secrets" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          required_vars=(
            "DATABASE_URL"
            "JWT_SECRET"
            "SENDGRID_API_KEY"
            "STRIPE_SECRET_KEY"
          )
          
          missing=0
          for var in "${required_vars[@]}"; do
            if [ -z "${!var}" ]; then
              echo "- ❌ \`$var\` is missing" >> $GITHUB_STEP_SUMMARY
              missing=$((missing + 1))
            else
              echo "- ✅ \`$var\` is set (first 4 chars: ${!var:0:4}...)" >> $GITHUB_STEP_SUMMARY
            fi
          done
          
          echo "missing=$missing" >> $GITHUB_OUTPUT

      - name: Run local env verification
        continue-on-error: true
        run: |
          echo "## Local .env Files" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ -f ".env" ]; then
            echo "- ✅ \`.env\` file exists ($(wc -l < .env) variables)" >> $GITHUB_STEP_SUMMARY
          else
            echo "- ⚠️  \`.env\` file not found (expected for CI)" >> $GITHUB_STEP_SUMMARY
          fi
          
          if [ -f "server/.env" ]; then
            echo "- ✅ \`server/.env\` file exists ($(wc -l < server/.env) variables)" >> $GITHUB_STEP_SUMMARY
          else
            echo "- ⚠️  \`server/.env\` file not found (expected for CI)" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Environment audit summary
        run: |
          echo "## Audit Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Mobile:** ${{ steps.mobile.outputs.missing }} missing" >> $GITHUB_STEP_SUMMARY
          echo "**Railway:** ${{ steps.railway.outputs.missing }} missing" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Action Items:**" >> $GITHUB_STEP_SUMMARY
          echo "- If secrets are missing, add them to GitHub Settings → Secrets and Variables → Actions" >> $GITHUB_STEP_SUMMARY
          echo "- Ensure Railway environment variables match GitHub secrets" >> $GITHUB_STEP_SUMMARY
          echo "- Review RAILWAY_CLEANUP_GUIDE.md for required variables" >> $GITHUB_STEP_SUMMARY

      - name: Fail if secrets missing
        run: |
          if [ "${{ steps.mobile.outputs.missing }}" -gt 0 ] || [ "${{ steps.railway.outputs.missing }}" -gt 0 ]; then
            echo "❌ Missing required environment variables"
            exit 1
          else
            echo "✅ All required environment variables are set"
            exit 0
          fi

      - name: Create issue if audit fails
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '🚨 Environment Audit Failed - Missing Secrets',
              body: `## Missing Environment Variables\n\n**Time:** ${new Date().toISOString()}\n\nThe environment audit detected missing required secrets. Check the workflow run for details: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\n\n**Steps:**\n1. Review the audit output\n2. Add missing secrets to GitHub Settings → Secrets and Variables → Actions\n3. Verify Railway dashboard has matching variables\n4. Re-run the audit workflow`,
              labels: ['alert', 'infrastructure', 'environment'],
            });

