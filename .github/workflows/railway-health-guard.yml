name: Railway Health Guard

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  health-check:
    name: Verify Railway API Health
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      
      - name: Install jq
        run: |
          sudo apt-get update
          sudo apt-get install -y jq
      
      - name: Run health check
        id: health
        run: |
          chmod +x scripts/railway-health-check.sh
          bash scripts/railway-health-check.sh --ci
        continue-on-error: true
      
      - name: Get health details
        if: always()
        run: |
          echo "## Railway Health Check Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Run verbose check for summary
          response=$(curl -sf https://api-production-8ac3.up.railway.app/health || echo '{"error":"unreachable"}')
          
          echo '```json' >> $GITHUB_STEP_SUMMARY
          echo "$response" | jq '.' 2>/dev/null || echo "$response" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          
          # Parse status
          status=$(echo "$response" | jq -r '.status' 2>/dev/null || echo "unknown")
          ready=$(echo "$response" | jq -r '.ready' 2>/dev/null || echo "unknown")
          
          if [ "$status" = "ok" ]; then
            echo "✅ **Status**: Healthy" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Status**: Unhealthy ($status)" >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "🔄 **Ready**: $ready" >> $GITHUB_STEP_SUMMARY
      
      - name: Block merge if unhealthy
        if: steps.health.outcome == 'failure'
        run: |
          echo "❌ Railway API health check failed"
          echo "The /health endpoint is not responding with status:ok"
          echo ""
          echo "Common causes:"
          echo "  - Service is down or restarting"
          echo "  - Database connection failed"
          echo "  - Missing environment variables"
          echo ""
          echo "Fix the issue before merging to main"
          exit 1
      
      - name: Comment on PR
        if: github.event_name == 'pull_request' && steps.health.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '## ⚠️ Railway Health Check Failed\n\nThe Railway API is not healthy. Please verify the deployment before merging.\n\n**Health endpoint**: https://api-production-8ac3.up.railway.app/health\n\n**Troubleshooting**:\n1. Check Railway dashboard for service status\n2. Verify environment variables are set\n3. Review deployment logs\n4. Run `bash scripts/railway-health-check.sh` locally'
            })
      
      - name: Success message
        if: steps.health.outcome == 'success'
        run: |
          echo "✅ Railway API is healthy - safe to merge"
