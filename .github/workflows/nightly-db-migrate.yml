name: Nightly DB Migration & Seed

on:
  schedule:
    - cron: '0 4 * * *' # 4 AM UTC nightly
  workflow_dispatch:

jobs:
  migrate-and-seed:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: varsityhub
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Setup Prisma
        run: npx prisma generate

      - name: Wait for Postgres
        run: |
          for i in {1..30}; do
            pg_isready -h localhost -p 5432 && break
            sleep 2
          done

      - name: Run DB Migrations
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/varsityhub
        run: npx prisma migrate deploy

      - name: Run Seed Script
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/varsityhub
          SEED_PASSWORD: ci
        run: node prisma/seed.ts

      - name: Verify Schema
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/varsityhub
        run: npx prisma db pull
