name: Railway Health Check

on:
  workflow_dispatch:
  schedule:
    - cron: '0 9 * * 1' # Weekly Monday 9 AM UTC

jobs:
  health-check:
    name: Verify Railway API Health
    runs-on: ubuntu-latest
    continue-on-error: true  # Prevents GitHub email spam on scheduled failures
    
    steps:
      - uses: actions/checkout@v4

      - name: Check Railway API health
        id: health
        continue-on-error: true
        run: |
          bash scripts/railway-health-check.sh --ci
          HEALTH_STATUS=$?
          
          if [ $HEALTH_STATUS -eq 0 ]; then
            echo "status=healthy" >> $GITHUB_OUTPUT
          else
            echo "status=unhealthy" >> $GITHUB_OUTPUT
          fi

      - name: Detailed health report
        if: always()
        run: |
          bash scripts/railway-health-check.sh > /tmp/health-report.txt 2>&1 || true
          cat /tmp/health-report.txt

      - name: Create status badge
        run: |
          if [ "${{ steps.health.outputs.status }}" == "healthy" ]; then
            echo "🟢 Railway API is healthy" > /tmp/badge.txt
            exit 0
          else
            echo "🔴 Railway API is unhealthy" > /tmp/badge.txt
            exit 1
          fi

      - name: Alert on failure
        if: steps.health.outputs.status == 'unhealthy'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '🚨 Railway API Health Check Failed',
              body: `**Date:** ${new Date().toISOString()}\n\nThe Railway API health endpoint is not responding. Check the API deployment and logs.`,
              labels: ['alert', 'infrastructure']
            });

      - name: Upload health report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: railway-health-report
          path: /tmp/health-report.txt
          retention-days: 30
