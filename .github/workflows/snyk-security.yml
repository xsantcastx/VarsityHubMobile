name: Snyk Security Scanning

on:
  push:
    branches: [main, develop]
    paths:
      - 'server/**'
      - '**/package.json'
      - '**/package-lock.json'
      - '.github/workflows/snyk-security.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'server/**'
      - '**/package.json'
      - '**/package-lock.json'
      - '.github/workflows/snyk-security.yml'
  workflow_dispatch:
    inputs:
      force:
        description: 'Run full Snyk scan now'
        required: false
        default: 'false'
  schedule:
    # Run daily at 2 AM UTC
    - cron: '0 2 * * *'

permissions:
  contents: read
  security-events: write
  pull-requests: write

jobs:
  snyk-scan:
    runs-on: ubuntu-latest
    name: Snyk Code & Dependency Scan
    # NOTE: Requires SNYK_TOKEN secret to be configured in GitHub repo settings
    # Add at: Settings > Secrets and variables > Actions > New repository secret
    if: >-
      !contains(github.event.head_commit.message, '[skip snyk]') &&
      (github.event_name != 'pull_request' || !contains(github.event.pull_request.title, '[skip snyk]')) &&
      (vars.SKIP_SNYK != 'true')
    env:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci && cd server && npm ci

      - name: Check Snyk token
        id: snyk-check
        run: |
          if [ -z "$SNYK_TOKEN" ]; then
            echo "SNYK_TOKEN not configured — skipping Snyk scans"
            echo "has-token=false" >> $GITHUB_OUTPUT
          else
            echo "has-token=true" >> $GITHUB_OUTPUT
          fi

      - name: Set up Snyk
        if: steps.snyk-check.outputs.has-token == 'true'
        uses: snyk/actions/setup@master

      - name: Run Snyk Code scan (SAST) - Frontend
        if: steps.snyk-check.outputs.has-token == 'true'
        run: snyk code test --severity-threshold=high --sarif-file-output=snyk-frontend.sarif
        continue-on-error: true

      - name: Run Snyk Code scan (SAST) - Server
        if: steps.snyk-check.outputs.has-token == 'true'
        run: cd server && snyk code test --severity-threshold=high --sarif-file-output=../snyk-server.sarif
        continue-on-error: true

      - name: Run Snyk Open Source scan (SCA) - Frontend
        if: steps.snyk-check.outputs.has-token == 'true'
        run: snyk test --severity-threshold=high
        continue-on-error: true

      - name: Run Snyk Open Source scan (SCA) - Server
        if: steps.snyk-check.outputs.has-token == 'true'
        run: cd server && snyk test --severity-threshold=high
        continue-on-error: true

      - name: Monitor with Snyk (main only)
        if: github.ref == 'refs/heads/main' && steps.snyk-check.outputs.has-token == 'true'
        run: |
          snyk monitor --project-name=varsityhubmobile-frontend
          cd server && snyk monitor --project-name=varsityhubmobile-server
        continue-on-error: true

      - name: Upload frontend SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always() && hashFiles('snyk-frontend.sarif') != ''
        with:
          sarif_file: snyk-frontend.sarif
          category: snyk-frontend

      - name: Upload server SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always() && hashFiles('snyk-server.sarif') != ''
        with:
          sarif_file: snyk-server.sarif
          category: snyk-server

  dependency-audit:
    runs-on: ubuntu-latest
    name: npm audit
    if: >-
      !contains(github.event.head_commit.message, '[skip snyk]') &&
      (github.event_name != 'pull_request' || !contains(github.event.pull_request.title, '[skip snyk]')) &&
      (vars.SKIP_SNYK != 'true')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Run npm audit (server)
        run: cd server && npm ci && npm audit --audit-level=moderate
        continue-on-error: true

      - name: Check for high/critical vulnerabilities (server)
        run: |
          cd server
          CRITICAL=$(npm audit --json 2>/dev/null | jq '.metadata.vulnerabilities.critical // 0')
          HIGH=$(npm audit --json 2>/dev/null | jq '.metadata.vulnerabilities.high // 0')
          if [ "$CRITICAL" -gt 0 ] || [ "$HIGH" -gt 0 ]; then
            echo "Found critical or high severity vulnerabilities in server"
            npm audit
            exit 1
          else
            echo "No high/critical vulnerabilities found in server"
          fi

  container-scan:
    runs-on: ubuntu-latest
    name: Container Security Scan
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      !contains(github.event.head_commit.message, '[skip snyk]') &&
      (vars.SKIP_SNYK != 'true')
    env:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Snyk
        uses: snyk/actions/setup@master

      - name: Build Docker image
        run: docker build -t varsityhub-server:latest -f server/Dockerfile server/

      - name: Run Snyk container scan
        run: snyk container test varsityhub-server:latest --severity-threshold=high --file=server/Dockerfile
        continue-on-error: true

      - name: Monitor container
        run: snyk container monitor varsityhub-server:latest --project-name=varsityhub-server-container --file=server/Dockerfile
        continue-on-error: true

  security-report:
    runs-on: ubuntu-latest
    name: Security Summary
    if: always()
    needs: [snyk-scan, dependency-audit]

    steps:
      - name: Check scan results
        run: |
          echo "Security Scanning Complete"
          echo "- Snyk Code scanning (SAST) - completed"
          echo "- Snyk Open Source scanning (SCA) - completed"
          echo "- npm audit - completed"
          echo ""
          echo "Next steps:"
          echo "  1. Review security tab for detailed findings"
          echo "  2. Check Snyk dashboard for continuous monitoring"
          echo "  3. Address high/critical issues before merge"
