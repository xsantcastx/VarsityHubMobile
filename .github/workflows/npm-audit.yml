name: npm Audit & Dependency Check

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  schedule:
    # Run nightly at 2 AM UTC (10 PM EST)
    - cron: '0 2 * * *'
  pull_request:
    paths:
      - 'package*.json'
      - 'server/package*.json'
  push:
    branches: [main]
    paths:
      - 'package*.json'
      - 'server/package*.json'

jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Audit root dependencies
        id: root-audit
        run: npm audit --json > audit-root.json 2>&1 || true

      - name: Parse root audit results
        id: root-parse
        run: |
          TOTAL=$(jq '.metadata.vulnerabilities.total // 0' audit-root.json)
          MODERATE=$(jq '.metadata.vulnerabilities.moderate // 0' audit-root.json)
          # Same allowlist policy as ci.yml: npm currently marks image-size <=2.0.2
          # vulnerable with no non-breaking remediation, which appears only via
          # Expo/Metro transitive deps in this repo.
          PARSED="$(node -e '
            const fs = require("node:fs");
            const report = JSON.parse(fs.readFileSync("audit-root.json", "utf8"));
            const vulns = report.vulnerabilities || {};
            const allowPackages = new Set([
              "image-size",
              "metro",
              "metro-config",
              "metro-transform-worker",
              "@expo/metro",
              "@expo/metro-config",
              "@expo/cli",
              "expo",
              "@react-native/community-cli-plugin",
              "react-native",
            ]);
            const allowGhsa = new Set(["GHSA-w3rx-r6r6-pgpr", "GHSA-5p2g-fcmc-qvqq"]);
            const isHighOrCritical = (s) => s === "high" || s === "critical";
            let critical = 0;
            let high = 0;
            let allowlistedHigh = 0;
            for (const [pkg, vuln] of Object.entries(vulns)) {
              if (!isHighOrCritical(vuln.severity)) continue;
              const via = Array.isArray(vuln.via) ? vuln.via : [];
              const isAllowlistedPkg = allowPackages.has(pkg);
              const hasUnknownVia = via.some((entry) => {
                if (typeof entry === "string") return !allowPackages.has(entry);
                if (!entry || typeof entry !== "object") return true;
                if (!isHighOrCritical(entry.severity)) return false;
                const ghsa = (entry.url || "").match(/GHSA-[^/]+/)?.[0] || "";
                return !allowGhsa.has(ghsa);
              });
              if (isAllowlistedPkg && !hasUnknownVia) {
                if (vuln.severity === "high") allowlistedHigh += 1;
                continue;
              }
              if (vuln.severity === "critical") critical += 1;
              else if (vuln.severity === "high") high += 1;
            }
            process.stdout.write(`${critical} ${high} ${allowlistedHigh}`);
          ')"
          CRITICAL="$(echo "$PARSED" | awk "{print \$1}")"
          HIGH="$(echo "$PARSED" | awk "{print \$2}")"
          ALLOWLISTED_HIGH="$(echo "$PARSED" | awk "{print \$3}")"
          echo "vulnerabilities=$TOTAL" >> $GITHUB_OUTPUT
          echo "critical=$CRITICAL" >> $GITHUB_OUTPUT
          echo "high=$HIGH" >> $GITHUB_OUTPUT
          echo "moderate=$MODERATE" >> $GITHUB_OUTPUT
          echo "allowlisted_high=$ALLOWLISTED_HIGH" >> $GITHUB_OUTPUT
          if [ "$TOTAL" -gt 0 ]; then
            echo "❌ Root vulnerabilities: $TOTAL"
            jq '.vulnerabilities | to_entries[] | "\(.value.name)@\(.value.via[0]) - \(.value.severity)"' audit-root.json
            if [ "$ALLOWLISTED_HIGH" -gt 0 ]; then
              echo "ℹ️ Allowlisted high vulnerabilities: $ALLOWLISTED_HIGH (Expo/Metro image-size chain)"
            fi
          fi

      - name: Audit server dependencies
        id: server-audit
        run: |
          cd server
          npm audit --json > ../audit-server.json 2>&1 || true

      - name: Parse server audit results
        id: server-parse
        run: |
          TOTAL=$(jq '.metadata.vulnerabilities.total // 0' audit-server.json)
          CRITICAL=$(jq '.metadata.vulnerabilities.critical // 0' audit-server.json)
          HIGH=$(jq '.metadata.vulnerabilities.high // 0' audit-server.json)
          MODERATE=$(jq '.metadata.vulnerabilities.moderate // 0' audit-server.json)
          echo "vulnerabilities=$TOTAL" >> $GITHUB_OUTPUT
          echo "critical=$CRITICAL" >> $GITHUB_OUTPUT
          echo "high=$HIGH" >> $GITHUB_OUTPUT
          echo "moderate=$MODERATE" >> $GITHUB_OUTPUT
          if [ "$TOTAL" -gt 0 ]; then
            echo "❌ Server vulnerabilities: $TOTAL"
            jq '.vulnerabilities | to_entries[] | "\(.value.name)@\(.value.via[0]) - \(.value.severity)"' audit-server.json
          fi

      - name: Comment on PR with results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const rootVulns = '${{ steps.root-parse.outputs.vulnerabilities }}';
            const serverVulns = '${{ steps.server-parse.outputs.vulnerabilities }}';
            const totalVulns = parseInt(rootVulns) + parseInt(serverVulns);

            const status = totalVulns === 0 ? '✅ Clean' : `❌ Found ${totalVulns} vulnerabilities`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `### npm Audit Results\n\n${status}\n\n- Root: ${rootVulns} vulnerabilities\n- Server: ${serverVulns} vulnerabilities`
            });

      - name: Upload audit artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: npm-audit-reports
          path: |
            audit-root.json
            audit-server.json

      - name: Write workflow summary
        if: always()
        run: |
          {
            echo "## npm Audit Summary"
            echo ""
            echo "| Scope | Critical | High | Moderate | Total |"
            echo "| --- | ---: | ---: | ---: | ---: |"
            echo "| Root | ${{ steps.root-parse.outputs.critical || '0' }} | ${{ steps.root-parse.outputs.high || '0' }} | ${{ steps.root-parse.outputs.moderate || '0' }} | ${{ steps.root-parse.outputs.vulnerabilities || '0' }} |"
            echo "| Server | ${{ steps.server-parse.outputs.critical || '0' }} | ${{ steps.server-parse.outputs.high || '0' }} | ${{ steps.server-parse.outputs.moderate || '0' }} | ${{ steps.server-parse.outputs.vulnerabilities || '0' }} |"
            echo ""
            echo "Scheduled runs stay report-only for moderate findings so the nightly signal is usable."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail on critical/high vulnerabilities
        if: (steps.root-parse.outputs.critical > 0) || (steps.root-parse.outputs.high > 0) || (steps.server-parse.outputs.critical > 0) || (steps.server-parse.outputs.high > 0)
        run: |
          echo "❌ npm audit found critical/high vulnerabilities"
          exit 1

      - name: Success
        if: success()
        run: echo "✅ No critical/high dependency vulnerabilities detected"
