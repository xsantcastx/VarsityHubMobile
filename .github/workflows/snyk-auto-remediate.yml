name: Snyk Security - Auto-Remediate

on:
  schedule:
    # Run weekly on Mondays at 9 AM UTC
    - cron: '0 9 * * 1'
  workflow_dispatch:

jobs:
  snyk-scan-and-remediate:
    name: Scan & Create Remediation PRs
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci && cd server && npm ci

      - name: Check Snyk token
        id: snyk-check
        run: |
          if [ -z "$SNYK_TOKEN" ]; then
            echo "SNYK_TOKEN not configured — skipping weekly Snyk auto-remediate run"
            echo "has-token=false" >> $GITHUB_OUTPUT
            exit 1
          else
            echo "has-token=true" >> $GITHUB_OUTPUT
          fi

      - name: Set up Snyk
        uses: snyk/actions/setup@master

      - name: Run Snyk SAST scan
        if: steps.snyk-check.outputs.has-token == 'true'
        id: snyk-sast
        run: |
          set +e
          node scripts/run-snyk-scan.cjs code > snyk-sast-report.json
          scan_status=$?
          set -e
          if [ "$scan_status" -gt 1 ]; then echo "::error::SAST coverage unavailable"; exit 1; fi
          ISSUE_COUNT=$(jq '.count' snyk-sast-report.json 2>/dev/null || echo 0)
          echo "sast_issues=$ISSUE_COUNT" >> $GITHUB_OUTPUT

      - name: Run Snyk SCA scan (root)
        if: steps.snyk-check.outputs.has-token == 'true'
        id: snyk-sca-root
        run: |
          set +e
          node scripts/run-snyk-scan.cjs dependencies > snyk-sca-root.json
          scan_status=$?
          set -e
          if [ "$scan_status" -gt 1 ]; then echo "::error::Dependency coverage unavailable"; exit 1; fi
          VULNS=$(jq '.count' snyk-sca-root.json 2>/dev/null || echo 0)
          echo "root_vulns=$VULNS" >> $GITHUB_OUTPUT

      - name: Run Snyk SCA scan (server)
        if: steps.snyk-check.outputs.has-token == 'true'
        id: snyk-sca-server
        run: |
          set +e
          (cd server && node ../scripts/run-snyk-scan.cjs dependencies --policy-path=../.snyk) > snyk-sca-server.json
          scan_status=$?
          set -e
          if [ "$scan_status" -gt 1 ]; then echo "::error::Dependency coverage unavailable"; exit 1; fi
          VULNS=$(jq '.count' snyk-sca-server.json 2>/dev/null || echo 0)
          echo "server_vulns=$VULNS" >> $GITHUB_OUTPUT

      - name: Attempt auto-fix (npm audit fix)
        if: steps.snyk-check.outputs.has-token == 'true'
        id: autofix
        run: |
          echo "Attempting root fixes..."
          npm audit fix --audit-level=moderate --save || true

          echo "Attempting server fixes..."
          cd server && npm audit fix --audit-level=moderate --save || true

          # Check if changes were made
          cd ..
          if git diff --quiet; then
            echo "changes_made=false" >> $GITHUB_OUTPUT
          else
            echo "changes_made=true" >> $GITHUB_OUTPUT
          fi

      - name: Create PR for auto-fixes
        if: steps.snyk-check.outputs.has-token == 'true' && steps.autofix.outputs.changes_made == 'true'
        uses: peter-evans/create-pull-request@v5
        with:
          commit-message: 'chore: snyk auto-remediate security vulnerabilities'
          title: '🔒 Security: Auto-remediate vulnerabilities'
          body: |
            # Snyk Auto-Remediate

            This PR contains auto-generated security fixes from Snyk scans.

            ## Summary
            - Root vulnerabilities: ${{ steps.snyk-sca-root.outputs.root_vulns }}
            - Server vulnerabilities: ${{ steps.snyk-sca-server.outputs.server_vulns }}
            - SAST issues: ${{ steps.snyk-sast.outputs.sast_issues }}

            ## Changes
            - Updated `package.json` with security patches (patch/minor versions only)
            - Updated `server/package.json` with security patches

            ## Next Steps
            1. Review changes in this PR
            2. Run tests locally: `npm test`
            3. If all tests pass, merge to trigger deployment

            **Note:** This is an automated PR. Manual review is still required.
          add-paths: |
            package.json
            package-lock.json
            server/package.json
            server/package-lock.json
          branch: 'snyk/auto-remediate'
          delete-branch: true

      - name: Generate Snyk report
        run: |
          cat > snyk-summary.md << 'EOF'
          # 🔒 Snyk Security Report

          **Run:** ${{ github.run_id }}

          ## Scan Results
          - **Token Present:** ${{ steps.snyk-check.outputs.has-token }}
          - **Root Vulnerabilities:** ${{ steps.snyk-sca-root.outputs.root_vulns || 'skipped' }}
          - **Server Vulnerabilities:** ${{ steps.snyk-sca-server.outputs.server_vulns || 'skipped' }}
          - **SAST Issues:** ${{ steps.snyk-sast.outputs.sast_issues || 'skipped' }}

          ## Actions Taken
          - ${{ steps.snyk-check.outputs.has-token == 'true' && '✅ Snyk scan completed' || '⚠️ SNYK_TOKEN missing — workflow skipped' }}
          - ${{ steps.autofix.outputs.changes_made == 'true' && '✅ Auto-remediation PR created' || '✅ No remediations needed' }}

          ## Artifacts
          - `snyk-sast-report.json` - Sanitized SAST summary
          - `snyk-sca-root.json` - Root dependency scan summary
          - `snyk-sca-server.json` - Server dependency scan summary

          ---
          *Automated weekly security scan*
          EOF

          cat snyk-summary.md

      - name: Upload Snyk reports
        uses: actions/upload-artifact@v4
        with:
          name: snyk-reports
          path: |
            snyk-sast-report.json
            snyk-sca-root.json
            snyk-sca-server.json
            snyk-summary.md
          retention-days: 30

      - name: Alert on critical issues
        if: steps.snyk-check.outputs.has-token == 'true' && (steps.snyk-sca-root.outputs.root_vulns > 0 || steps.snyk-sca-server.outputs.server_vulns > 0)
        run: |
          echo "⚠️  Vulnerabilities detected - check Snyk reports"
          exit 0  # Don't fail workflow, just alert

      - name: Success
        if: success()
        run: echo "✅ Snyk scan and remediation check completed"
