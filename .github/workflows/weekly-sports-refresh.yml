name: Weekly Sports Schedule Refresh

# Fully automated. Every Monday: syncs the real MLB + WNBA schedule for the
# current rolling 7-day window (today -> today+6), then deletes MLB/WNBA
# games older than a couple days so the auto-synced schedule doesn't grow
# forever. Never touches Fanatics Fest, FIFA, or any other curated/one-off
# or user-generated content — see cleanup-stale-games.ts for the exact scope.
#
# Marquee/curated events (festivals, one-off watch parties, etc.) stay
# manual — those go through server/scripts/one-off/ on request, not here.

on:
  schedule:
    - cron: '0 12 * * 1' # every Monday, 12:00 UTC — only fires once this file is on main
  workflow_dispatch: {}

jobs:
  refresh:
    name: Refresh MLB + WNBA schedule
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json
      - name: Install server dependencies
        working-directory: server
        run: npm ci
      - name: Generate Prisma client
        working-directory: server
        run: npx prisma generate
      - name: Compute rolling 7-day window
        id: window
        run: |
          echo "from=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
          echo "to=$(date -u -d '+6 days' +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
      - name: Sync MLB schedule
        working-directory: server
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
        run: npx tsx scripts/mlb/sync-mlb-schedule.ts --from "${{ steps.window.outputs.from }}" --to "${{ steps.window.outputs.to }}"
      - name: Sync WNBA schedule
        working-directory: server
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
        run: npx tsx scripts/wnba/sync-wnba-schedule.ts --from "${{ steps.window.outputs.from }}" --to "${{ steps.window.outputs.to }}"
      - name: Clean up stale MLB/WNBA games
        working-directory: server
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
        run: npx tsx scripts/weekly/cleanup-stale-games.ts
