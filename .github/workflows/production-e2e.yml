name: Production E2E

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production-e2e:
    name: ${{ matrix.label }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: coach-approval-flow
            label: Coach Approval Flow
            script: server/scripts/e2e/test-coach-application-flow.sh
            requires_admin: "true"
            requires_db: "true"
          - id: single-session
            label: Single Session
            script: server/scripts/e2e/test-single-session.sh
            requires_admin: "false"
            requires_db: "false"
          - id: cross-system
            label: Cross-System
            script: server/scripts/e2e/test-integration-crossmatrix.sh
            requires_admin: "true"
            requires_db: "true"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Enforce allowed branches
        run: |
          set -euo pipefail

          case "${GITHUB_REF_NAME}" in
            main|1.0.1)
              ;;
            *)
              echo "Production E2E may only run from main or 1.0.1. Current ref: ${GITHUB_REF_NAME}"
              exit 1
              ;;
          esac

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install runtime tools
        run: |
          npm install --global @railway/cli bcryptjs
          sudo apt-get update
          sudo apt-get install --yes jq postgresql-client

      - name: Validate workflow secrets
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          PRODUCTION_DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
          PROD_ADMIN_EMAIL: ${{ secrets.PROD_ADMIN_EMAIL }}
          PROD_ADMIN_PASSWORD: ${{ secrets.PROD_ADMIN_PASSWORD }}
        run: |
          set -euo pipefail

          if [ "${{ matrix.requires_db }}" = "true" ] && [ -z "${PRODUCTION_DATABASE_URL:-}" ] && [ -z "${RAILWAY_TOKEN:-}" ]; then
            echo "Missing GitHub secret: PRODUCTION_DATABASE_URL or RAILWAY_TOKEN"
            exit 1
          fi

          if [ "${{ matrix.requires_admin }}" = "true" ]; then
            if [ -z "${PROD_ADMIN_EMAIL:-}" ]; then
              echo "Missing GitHub secret: PROD_ADMIN_EMAIL"
              exit 1
            fi

            if [ -z "${PROD_ADMIN_PASSWORD:-}" ]; then
              echo "Missing GitHub secret: PROD_ADMIN_PASSWORD"
              exit 1
            fi
          fi

      - name: Link Railway production project
        if: ${{ matrix.requires_db == 'true' }}
        env:
          PRODUCTION_DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          set -euo pipefail

          if [ -n "${PRODUCTION_DATABASE_URL:-}" ]; then
            echo "PRODUCTION_DATABASE_URL provided; skipping Railway link."
            exit 0
          fi

          railway link --project 22899614-5ae1-47e9-bdd6-7f6d5ce5619e --environment production --service 6bf477a3-56a7-44d0-aa29-ff86a76cdc02

      - name: Resolve production database URL
        if: ${{ matrix.requires_db == 'true' }}
        id: db
        env:
          PRODUCTION_DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          set -euo pipefail

          if [ -n "${PRODUCTION_DATABASE_URL:-}" ]; then
            DATABASE_URL="$PRODUCTION_DATABASE_URL"
          else
            DATABASE_URL="$(railway variable list --service 9f1e9f03-53f7-4d90-8744-d711e76f5e80 --environment production --kv | awk -F= '/^DATABASE_PUBLIC_URL=/{print $2}')"
          fi

          if [ -z "$DATABASE_URL" ]; then
            echo "Failed to resolve production database URL"
            exit 1
          fi

          echo "::add-mask::$DATABASE_URL"
          echo "database_url=$DATABASE_URL" >> "$GITHUB_OUTPUT"

      - name: Normalize verification login account
        if: ${{ matrix.requires_admin == 'true' }}
        env:
          DATABASE_URL: ${{ steps.db.outputs.database_url }}
          PROD_ADMIN_EMAIL: ${{ secrets.PROD_ADMIN_EMAIL }}
          PROD_ADMIN_PASSWORD: ${{ secrets.PROD_ADMIN_PASSWORD }}
        run: |
          set -euo pipefail

          if [ -z "${DATABASE_URL:-}" ]; then
            echo "DATABASE_URL is required to normalize the verification login account"
            exit 1
          fi

          HASH="$(
            NODE_PATH="$(npm root -g)" node -e \
              "const bcrypt=require('bcryptjs'); process.stdout.write(bcrypt.hashSync(process.argv[1], 10));" \
              "$PROD_ADMIN_PASSWORD"
          )"
          EMAIL_LC="$(printf '%s' "$PROD_ADMIN_EMAIL" | tr '[:upper:]' '[:lower:]')"

          psql "$DATABASE_URL" \
            -v ON_ERROR_STOP=1 \
            -v admin_email="$EMAIL_LC" \
            -v password_hash="$HASH" <<'SQL'
          WITH upserted AS (
            INSERT INTO "User" (
              id,
              email,
              password_hash,
              display_name,
              created_at,
              email_verified,
              password_changed_at,
              session_epoch,
              banned,
              preferences,
              role,
              onboarding_completed,
              proceeding_as_fan,
              plan,
              payment_pending,
              payment_approved,
              approval_status,
              subscription_tier,
              subscription_status,
              max_teams,
              paid_by_owner
            )
            VALUES (
              'seed_' || substr(md5(random()::text || clock_timestamp()::text), 1, 24),
              :'admin_email',
              :'password_hash',
              'Production Verification Admin',
              NOW(),
              TRUE,
              NOW(),
              0,
              FALSE,
              '{"role":"fan","onboarding_completed":true}'::jsonb,
              'fan'::"UserRole",
              TRUE,
              FALSE,
              'rookie'::"MembershipPlan",
              FALSE,
              FALSE,
              'APPROVED'::"ApprovalStatus",
              'free',
              'active',
              3,
              FALSE
            )
            ON CONFLICT (email) DO UPDATE
            SET
              password_hash = EXCLUDED.password_hash,
              email_verified = TRUE,
              password_changed_at = NOW(),
              session_epoch = "User".session_epoch + 1,
              banned = FALSE,
              banned_until = NULL,
              ban_reason = NULL,
              deleted_at = NULL,
              deletion_anonymized = FALSE
            RETURNING id
          )
          DELETE FROM "RefreshToken"
          WHERE user_id IN (SELECT id FROM upserted);
          SQL

      - name: Preflight admin access contract
        if: ${{ matrix.requires_admin == 'true' }}
        env:
          API_URL: https://api-production-8ac3.up.railway.app
          ADMIN_EMAIL: ${{ secrets.PROD_ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.PROD_ADMIN_PASSWORD }}
        run: |
          set -euo pipefail

          LOGIN_JSON="$(
            curl -fsS -X POST "$API_URL/auth/login" \
              -H 'Content-Type: application/json' \
              -d "$(jq -cn --arg email "$ADMIN_EMAIL" --arg password "$ADMIN_PASSWORD" '{email:$email,password:$password}')"
          )"
          ACCESS_TOKEN="$(printf '%s' "$LOGIN_JSON" | jq -r '.access_token // empty')"
          if [ -z "$ACCESS_TOKEN" ]; then
            echo "Configured production admin could not log in"
            echo "$LOGIN_JSON"
            exit 1
          fi

          ME_JSON="$(curl -fsS "$API_URL/auth/me" -H "Authorization: Bearer $ACCESS_TOKEN")"
          IS_ADMIN="$(printf '%s' "$ME_JSON" | jq -r '.is_admin // false')"
          if [ "$IS_ADMIN" != "true" ]; then
            echo "Configured production admin is not recognized as admin by /auth/me"
            echo "$ME_JSON"
            exit 1
          fi

          DASH_STATUS="$(
            curl -sS -o /tmp/production-admin-dashboard.json -w '%{http_code}' \
              "$API_URL/admin/dashboard" \
              -H "Authorization: Bearer $ACCESS_TOKEN"
          )"
          if [ "$DASH_STATUS" != "200" ]; then
            echo "Configured production admin failed /admin/dashboard preflight"
            cat /tmp/production-admin-dashboard.json
            exit 1
          fi

      - name: Run production verification script
        id: run-script
        continue-on-error: true
        env:
          API_URL: https://api-production-8ac3.up.railway.app
          DATABASE_URL: ${{ steps.db.outputs.database_url }}
          ADMIN_EMAIL: ${{ secrets.PROD_ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.PROD_ADMIN_PASSWORD }}
        run: |
          set -euo pipefail

          mkdir -p .github/tmp
          LOG_FILE=".github/tmp/${{ matrix.id }}.log"

          set +e
          timeout 300s bash "${{ matrix.script }}" 2>&1 | tee "$LOG_FILE"
          status=${PIPESTATUS[0]}
          set -e

          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          echo "log_file=$LOG_FILE" >> "$GITHUB_OUTPUT"

          exit "$status"

      - name: Upload production verification log
        if: always() && steps.run-script.outputs.log_file != ''
        uses: actions/upload-artifact@v4
        with:
          name: production-e2e-${{ matrix.id }}-log
          path: ${{ steps.run-script.outputs.log_file }}
          if-no-files-found: warn
          retention-days: 14

      - name: Append run summary
        if: always()
        run: |
          set -euo pipefail

          EXIT_CODE="${{ steps.run-script.outputs.exit_code }}"
          LOG_FILE="${{ steps.run-script.outputs.log_file }}"

          if [ -z "$EXIT_CODE" ]; then
            EXIT_CODE="1"
          fi

          {
            echo "## ${{ matrix.label }}"
            echo ""
            echo "- Script: \`${{ matrix.script }}\`"
            echo "- Timeout: \`300s\`"
            if [ "$EXIT_CODE" = "0" ]; then
              echo "- Result: passed"
            elif [ "$EXIT_CODE" = "124" ]; then
              echo "- Result: failed (timeout after 300s)"
            else
              echo "- Result: failed (exit $EXIT_CODE)"
            fi

            if [ "$EXIT_CODE" != "0" ] && [ -n "$LOG_FILE" ] && [ -f "$LOG_FILE" ]; then
              echo ""
              echo "Last 50 log lines:"
              echo '```text'
              tail -n 50 "$LOG_FILE"
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail job when verification fails
        if: ${{ steps.run-script.outputs.exit_code != '0' }}
        run: exit 1
