name: Secret scan (gitleaks)

on:
  pull_request:
  push:
    branches: [main, '1.0.1']
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  scan:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history so gitleaks can scan every commit, not just the
          # PR diff. Removes most "scan only the diff" false-greens.
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Use the repo-local config (allowlists for tracked-on-purpose
          # public values). Without this the default ruleset trips on
          # our OAuth client IDs and Sentry DSN.
          GITLEAKS_CONFIG: .gitleaks.toml
          # Fail the workflow if any secret is detected.
          GITLEAKS_NOTIFY_USER_LIST: ''
