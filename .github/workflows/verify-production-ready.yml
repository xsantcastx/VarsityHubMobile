#!/bin/bash
# GitHub Actions CI workflow for VarsityHub
# Save as: .github/workflows/verify-production-ready.yml
# 
# This workflow runs the production readiness checks on every push and PR
# to ensure pre-launch requirements are always met.

name: Production Readiness Check

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  verify:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v6
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci
    
    - name: Run Production Readiness Verification
      run: ./verify-production-ready.sh
    
    - name: Upload verification report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: verification-report
        path: verification-report.txt
        retention-days: 30

  typecheck:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v6
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci
    
    - name: TypeScript Compilation Check
      run: npx tsc --noEmit
    
    - name: ESLint Check (if configured)
      run: npm run lint --if-present
      continue-on-error: true

  build:
    runs-on: ubuntu-latest
    needs: [verify, typecheck]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v6
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci
    
    - name: Build server
      run: cd server && npm run build --if-present
      continue-on-error: true
