#!/bin/bash
# GitHub Actions CI workflow for VarsityHub
# Save as: .github/workflows/verify-production-ready.yml
# 
# This workflow runs the production readiness checks on every push and PR
# to ensure pre-launch requirements are always met.

name: Production Readiness Check

on:
  workflow_dispatch:
  schedule:
    - cron: '0 10 * * 1' # Weekly Monday 10 AM UTC

jobs:
  verify:
    runs-on: ubuntu-latest
    continue-on-error: true  # Prevents GitHub email spam on scheduled failures
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci
    
    - name: Run Production Readiness Verification
      run: |
        if [ -f "scripts/moved-from-root/verify-production-ready.sh" ]; then
          bash scripts/moved-from-root/verify-production-ready.sh
        elif [ -f "scripts/verify-production-ready.sh" ]; then
          bash scripts/verify-production-ready.sh
        else
          echo "⚠️  verify-production-ready.sh not found, skipping"
          echo "Production readiness check skipped" > verification-report.txt
        fi
    
    - name: Upload verification report
      if: always()
      uses: actions/upload-artifact@v6
      with:
        name: verification-report
        path: verification-report.txt
        retention-days: 30

  typecheck:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci
    
    - name: TypeScript Compilation Check
      run: npx tsc --noEmit
    
    - name: ESLint Check
      run: npm run lint

  build:
    runs-on: ubuntu-latest
    needs: [verify, typecheck]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci
    
    - name: Build server
      run: cd server && npm ci && npm run build
