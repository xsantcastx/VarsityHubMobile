name: Auto-Generate Changelog

on:
  push:
    branches: [main]
    tags:
      - 'v*'

jobs:
  generate-changelog:
    name: Generate Release Notes
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Generate changelog
        id: changelog
        run: |
          # Get last tag or default to first commit
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || git rev-list --max-parents=0 HEAD)
          CURRENT_TAG=$(git describe --tags 2>/dev/null || git rev-parse --short HEAD)
          
          echo "Generating changelog from $LAST_TAG to HEAD..."
          
          # Parse commits by type
          cat > generate-changelog.js << 'EOFJS'
          const { execSync } = require('child_process');
          
          const lastTag = process.argv[1] || 'HEAD~10';
          const currentTag = process.argv[2] || 'HEAD';
          
          try {
            const commits = execSync(`git log ${lastTag}..${currentTag} --pretty=format:"%H|%s|%b"`, { encoding: 'utf8' })
              .split('\n')
              .filter(line => line.trim());
            
            const features = [];
            const bugfixes = [];
            const security = [];
            const docs = [];
            const refactors = [];
            const other = [];
            
            commits.forEach(commit => {
              const [hash, subject, body] = commit.split('|');
              const shortHash = hash.substring(0, 7);
              
              if (subject.startsWith('feat:')) {
                features.push(`- ${subject.replace('feat:', '').trim()} (${shortHash})`);
              } else if (subject.startsWith('fix:')) {
                bugfixes.push(`- ${subject.replace('fix:', '').trim()} (${shortHash})`);
              } else if (subject.startsWith('security:') || subject.startsWith('chore: snyk')) {
                security.push(`- ${subject.replace(/^(security:|chore:\s*snyk)/, '').trim()} (${shortHash})`);
              } else if (subject.startsWith('docs:')) {
                docs.push(`- ${subject.replace('docs:', '').trim()} (${shortHash})`);
              } else if (subject.startsWith('refactor:')) {
                refactors.push(`- ${subject.replace('refactor:', '').trim()} (${shortHash})`);
              } else {
                other.push(`- ${subject} (${shortHash})`);
              }
            });
            
            const date = new Date().toISOString().split('T')[0];
            const version = process.env.RELEASE_VERSION || date;
            
            let changelog = `## v${version} - ${date}\n\n`;
            
            if (features.length > 0) {
              changelog += `### ✨ Features\n${features.join('\n')}\n\n`;
            }
            if (bugfixes.length > 0) {
              changelog += `### 🐛 Bug Fixes\n${bugfixes.join('\n')}\n\n`;
            }
            if (security.length > 0) {
              changelog += `### 🔒 Security\n${security.join('\n')}\n\n`;
            }
            if (refactors.length > 0) {
              changelog += `### ♻️ Refactoring\n${refactors.join('\n')}\n\n`;
            }
            if (docs.length > 0) {
              changelog += `### 📚 Documentation\n${docs.join('\n')}\n\n`;
            }
            if (other.length > 0) {
              changelog += `### 🔧 Other\n${other.join('\n')}\n\n`;
            }
            
            changelog += `\n**Full Changelog:** https://github.com/xsantcastx/VarsityHubMobile/compare/${lastTag}...${currentTag}\n`;
            
            console.log(changelog);
          } catch (error) {
            console.log('## v1.0.0 - ' + new Date().toISOString().split('T')[0]);
            console.log('\n### ✨ Features\n- Initial release\n');
          }
          EOFJS
          
          node generate-changelog.js "$LAST_TAG" "$CURRENT_TAG" > CHANGELOG_ENTRY.md
          cat CHANGELOG_ENTRY.md

      - name: Prepend to CHANGELOG.md
        run: |
          if [ -f "CHANGELOG.md" ]; then
            echo "# Changelog" > CHANGELOG_TEMP.md
            echo "" >> CHANGELOG_TEMP.md
            cat CHANGELOG_ENTRY.md >> CHANGELOG_TEMP.md
            echo "" >> CHANGELOG_TEMP.md
            tail -n +2 CHANGELOG.md >> CHANGELOG_TEMP.md
            mv CHANGELOG_TEMP.md CHANGELOG.md
          else
            echo "# Changelog" > CHANGELOG.md
            echo "" >> CHANGELOG.md
            cat CHANGELOG_ENTRY.md >> CHANGELOG.md
          fi
          
          cat CHANGELOG.md

      - name: Commit changelog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          if ! git diff --quiet CHANGELOG.md; then
            git add CHANGELOG.md
            git commit -m "chore: auto-generate changelog"
            git push origin main
          else
            echo "No changes to changelog"
          fi

      - name: Create release (if tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          body_path: CHANGELOG_ENTRY.md
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Comment on PR with changelog
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const changelog = fs.readFileSync('CHANGELOG_ENTRY.md', 'utf8');
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## 📝 Changelog Preview\n\n${changelog}`
            });
