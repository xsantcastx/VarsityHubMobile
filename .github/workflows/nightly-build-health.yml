name: Nightly Build Health Monitor

on:
  schedule:
    # Run nightly at 3 AM UTC (10 PM EST)
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  check-build-health:
    name: EAS Build Status Check
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install EAS CLI
        run: npm install -g eas-cli

      - name: Check recent builds
        id: builds
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          eas build:list --limit 5 --json > builds.json 2>&1 || true
          cat builds.json
          
          # Parse build status
          LATEST_BUILD=$(jq -r '.[0]' builds.json 2>/dev/null || echo "N/A")
          STATUS=$(echo $LATEST_BUILD | jq -r '.status // "unknown"')
          BUILD_ID=$(echo $LATEST_BUILD | jq -r '.id // "unknown"')
          PLATFORM=$(echo $LATEST_BUILD | jq -r '.platform // "unknown"')
          CREATED=$(echo $LATEST_BUILD | jq -r '.createdAt // "unknown"')
          
          echo "build_id=$BUILD_ID" >> $GITHUB_OUTPUT
          echo "status=$STATUS" >> $GITHUB_OUTPUT
          echo "platform=$PLATFORM" >> $GITHUB_OUTPUT
          echo "created=$CREATED" >> $GITHUB_OUTPUT

      - name: Check dependencies health
        id: deps
        run: |
          npm audit --json > audit.json 2>&1 || true
          
          CRITICAL=$(jq '.metadata.vulnerabilities.critical // 0' audit.json)
          HIGH=$(jq '.metadata.vulnerabilities.high // 0' audit.json)
          TOTAL=$(jq '.metadata.vulnerabilities.total // 0' audit.json)
          
          echo "critical=$CRITICAL" >> $GITHUB_OUTPUT
          echo "high=$HIGH" >> $GITHUB_OUTPUT
          echo "total=$TOTAL" >> $GITHUB_OUTPUT
          
          if [ "$CRITICAL" -gt 0 ] || [ "$HIGH" -gt 0 ]; then
            echo "⚠️  Vulnerabilities found: $CRITICAL critical, $HIGH high"
          fi

      - name: Generate health report
        run: |
          cat > build-health-report.md << 'EOF'
          # 🏥 VarsityHub Build Health Report
          
          **Date:** $(date)
          
          ## Latest EAS Build
          - **Build ID:** ${{ steps.builds.outputs.build_id }}
          - **Status:** ${{ steps.builds.outputs.status }}
          - **Platform:** ${{ steps.builds.outputs.platform }}
          - **Created:** ${{ steps.builds.outputs.created }}
          
          ## Dependency Health
          - **Critical Vulnerabilities:** ${{ steps.deps.outputs.critical }}
          - **High Vulnerabilities:** ${{ steps.deps.outputs.high }}
          - **Total Issues:** ${{ steps.deps.outputs.total }}
          
          ## Last Checks
          - ✅ Nightly audit completed at $(date)
          - 📊 Building health baseline
          
          ---
          *Generated by GitHub Actions*
          EOF
          
          cat build-health-report.md

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: build-health-report
          path: build-health-report.md
          retention-days: 30

      - name: Alert on build failure
        if: steps.builds.outputs.status == 'FAILED'
        run: |
          echo "❌ Latest EAS build FAILED"
          exit 1

      - name: Alert on vulnerabilities
        if: steps.deps.outputs.critical > 0 || steps.deps.outputs.high > 0
        run: |
          echo "⚠️  Critical or high vulnerabilities detected"
          exit 1

      - name: Success
        if: success()
        run: echo "✅ Build health check passed"
