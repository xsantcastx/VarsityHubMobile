name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: varsityhub_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d varsityhub_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/varsityhub_test
      JWT_SECRET: ci-jwt-secret-ci-jwt-secret-ci-jwt-secret
      JWT_REFRESH_SECRET: ci-refresh-secret-ci-refresh-secret-ci
      NODE_ENV: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json

      - name: Install App Dependencies
        run: npm ci

      - name: Install Server Dependencies
        run: npm --prefix server ci

      - name: Prepare Server Test Database
        run: npm --prefix server exec prisma db push --skip-generate

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: App Tests
        run: npm test -- --runInBand

      - name: Server Tests
        run: npm --prefix server test -- --runInBand
