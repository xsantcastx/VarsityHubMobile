name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      runEmailTemplatesCheck:
        description: "Run email templates check job"
        required: false
        type: boolean
        default: true

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Expo Doctor (non-blocking)
        run: npm run doctor
        continue-on-error: true

      - name: Lint & Type Check
        run: npm run lint:strict


      - name: Install Playwright Browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: |
            ~/.cache/ms-playwright
            ~/.cache/playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Start Expo web server for Playwright
        env:
          CI: "1"
          PORT: "8081"
          RCT_METRO_PORT: "8081"
          EXPO_NO_TELEMETRY: "1"
        run: |
          nohup npm run web:playwright > /tmp/expo-web.log 2>&1 &
          echo $! > /tmp/expo-web.pid

      - name: Wait for Expo web server
        run: npx wait-on --timeout 120000 http://localhost:8081

      - name: Run Playwright smoke tests
        run: npm run test:smoke

      - name: Stop Expo web server
        if: always()
        run: |
          if [ -f /tmp/expo-web.pid ]; then
            kill "$(cat /tmp/expo-web.pid)" || true
          fi
          if [ -f /tmp/expo-web.log ]; then
            echo "---- Expo web log (tail) ----"
            tail -n 200 /tmp/expo-web.log || true
          fi

      - name: Run Tests
        run: npm test -- --runInBand --no-watchman --passWithNoTests

      - name: Check for security vulnerabilities
        run: npm audit --audit-level=moderate
        continue-on-error: true

  email-templates-check:
    runs-on: ubuntu-latest
    name: Email Templates Check
    if: >-
      github.event_name == 'workflow_dispatch' && inputs.runEmailTemplatesCheck == true || contains(github.event.head_commit.message, '[run email check]')
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: |
          npm ci
          npm run server:install
      - name: Run email templates check
        run: npm run check:email-templates
