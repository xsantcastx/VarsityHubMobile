apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

def projectRoot = rootDir.getAbsoluteFile().getParentFile().getAbsolutePath()

/**
 * This is the configuration block to customize your React Native Android app.
 * By default you don't need to apply any configuration, just uncomment the lines you need.
 */
react {
    entryFile = file(["node", "-e", "require('expo/scripts/resolveAppEntry')", projectRoot, "android", "absolute"].execute(null, rootDir).text.trim())
    reactNativeDir = new File(["node", "--print", "require.resolve('react-native/package.json')"].execute(null, rootDir).text.trim()).getParentFile().getAbsoluteFile()
    hermesCommand = new File(["node", "--print", "require.resolve('react-native/package.json')"].execute(null, rootDir).text.trim()).getParentFile().getAbsolutePath() + "/sdks/hermesc/%OS-BIN%/hermesc"
    codegenDir = new File(["node", "--print", "require.resolve('@react-native/codegen/package.json', { paths: [require.resolve('react-native/package.json')] })"].execute(null, rootDir).text.trim()).getParentFile().getAbsoluteFile()

    enableBundleCompression = (findProperty('android.enableBundleCompression') ?: false).toBoolean()
    // Use Expo CLI to bundle the app, this ensures the Metro config
    // works correctly with Expo projects.
    cliFile = new File(["node", "--print", "require.resolve('@expo/cli', { paths: [require.resolve('expo/package.json')] })"].execute(null, rootDir).text.trim())
    bundleCommand = "export:embed"

    /* Folders */
     //   The root of your project, i.e. where "package.json" lives. Default is '../..'
    // root = file("../../")
    //   The folder where the react-native NPM package is. Default is ../../node_modules/react-native
    // reactNativeDir = file("../../node_modules/react-native")
    //   The folder where the react-native Codegen package is. Default is ../../node_modules/@react-native/codegen
    // codegenDir = file("../../node_modules/@react-native/codegen")

    /* Variants */
    //   The list of variants to that are debuggable. For those we're going to
    //   skip the bundling of the JS bundle and the assets. By default is just 'debug'.
    //   If you add flavors like lite, prod, etc. you'll have to list your debuggableVariants.
    // debuggableVariants = ["liteDebug", "prodDebug"]

    /* Bundling */
    //   A list containing the node command and its flags. Default is just 'node'.
    // nodeExecutableAndArgs = ["node"]

    //
    //   The path to the CLI configuration file. Default is empty.
    // bundleConfig = file(../rn-cli.config.js)
    //
    //   The name of the generated asset file containing your JS bundle
    // bundleAssetName = "MyApplication.android.bundle"
    //
    //   The entry file for bundle generation. Default is 'index.android.js' or 'index.js'
    // entryFile = file("../js/MyApplication.android.js")
    //
    //   A list of extra flags to pass to the 'bundle' commands.
    //   See https://github.com/react-native-community/cli/blob/main/docs/commands.md#bundle
    // extraPackagerArgs = []

    /* Hermes Commands */
    //   The hermes compiler command to run. By default it is 'hermesc'
    // hermesCommand = "$rootDir/my-custom-hermesc/bin/hermesc"
    //
    //   The list of flags to pass to the Hermes compiler. By default is "-O", "-output-source-map"
    // hermesFlags = ["-O", "-output-source-map"]

    /* Autolinking */
    autolinkLibrariesWithApp()
}

/**
 * Set this to true in release builds to optimize the app using [R8](https://developer.android.com/topic/performance/app-optimization/enable-app-optimization).
 */
def enableMinifyInReleaseBuilds = true

/**
 * The preferred build flavor of JavaScriptCore (JSC)
 *
 * For example, to use the international variant, you can use:
 * `def jscFlavor = 'org.webkit:android-jsc-intl:+'`
 *
 * The international variant includes ICU i18n library and necessary data
 * allowing to use e.g. `Date.toLocaleString` and `String.localeCompare` that
 * give correct results when using with locales other than en-US. Note that
 * this variant is about 6MiB larger per architecture than default.
 */
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

def sentryDisableAutoUpload = (System.getenv("SENTRY_DISABLE_AUTO_UPLOAD") ?: "").toBoolean()
def sentryAllowFailure = (System.getenv("SENTRY_ALLOW_FAILURE") ?: "").toBoolean()
def sentryAuthToken = System.getenv("SENTRY_AUTH_TOKEN")
def sentryAuthTokenValue = sentryAuthToken == null ? "" : sentryAuthToken.trim()
def sentryTokenLooksPlaceholder = sentryAuthTokenValue.isEmpty() ||
    sentryAuthTokenValue == "<your_token>" ||
    sentryAuthTokenValue == "YOUR_REAL_TOKEN_HERE"
def sentryHasAuthToken = !sentryTokenLooksPlaceholder

// Enable Sentry uploads when token is available
// SENTRY_ALLOW_FAILURE allows builds to continue if upload fails (safety net)
def shouldUploadSentry = !sentryDisableAutoUpload && sentryHasAuthToken

project.ext.sentryCli = [
    logLevel: System.getenv("SENTRY_LOG_LEVEL") ?: "info",
    autoUpload: shouldUploadSentry
]

// Also set as project property for the Sentry plugin to read
project.ext.set("sentryAutoUpload", shouldUploadSentry)
project.ext.set("sentryAllowFailure", sentryAllowFailure)

apply from: new File(["node", "--print", "require('path').dirname(require.resolve('@sentry/react-native/package.json'))"].execute().text.trim(), "sentry.gradle")

// Make Sentry upload tasks work properly but allow failures if SENTRY_ALLOW_FAILURE is set
// This enables Sentry uploads when token is available, but prevents build failures
tasks.whenTaskAdded { task ->
    def isSentryTask = task.name.contains("Sentry") && (
        task.name.contains("Upload") || 
        task.name.contains("upload") ||
        task.name.contains("SentryUpload")
    )
    
    if (isSentryTask) {
        if (!sentryHasAuthToken || sentryDisableAutoUpload) {
            // Disable only if no token or explicitly disabled
            task.enabled = false
            task.actions.clear()
            task.doFirst {
                logger.warn("⚠️  Sentry upload task disabled: SENTRY_AUTH_TOKEN not configured or SENTRY_DISABLE_AUTO_UPLOAD=true")
            }
            task.doLast {
                logger.warn("⚠️  Sentry upload skipped")
            }
        } else if (sentryAllowFailure) {
            // With token and SENTRY_ALLOW_FAILURE, allow upload but don't fail build on error
            def originalActions = new ArrayList(task.actions)
            task.actions.clear()
            
            originalActions.each { action ->
                task.doLast {
                    try {
                        if (action instanceof Closure) {
                            action.delegate = task
                            action.call()
                        } else {
                            action.execute(task)
                        }
                    } catch (Exception e) {
                        logger.warn("⚠️  Sentry upload failed but build will continue (SENTRY_ALLOW_FAILURE=true): ${e.message}")
                        // Suppress the exception - don't fail the build
                    }
                }
            }
        }
        // If token exists and SENTRY_ALLOW_FAILURE is not set, let Sentry work normally
    }
}

// Catch lintVitalRelease task when it's created
tasks.whenTaskAdded { task ->
    if (task.name == 'lintVitalRelease') {
        task.enabled = false
        task.actions.clear()
        task.doFirst {
            logger.warn("⚠️  lintVitalRelease disabled to prevent ExtraTranslation errors")
        }
    }
}

// Also catch tasks that already exist
afterEvaluate {
    tasks.all { task ->
        def isSentryTask = task.name.contains("Sentry") && (
            task.name.contains("Upload") || 
            task.name.contains("upload") ||
            task.name.contains("SentryUpload")
        )
        
        if (isSentryTask) {
            if (!sentryHasAuthToken || sentryDisableAutoUpload) {
                task.enabled = false
                task.actions.clear()
                task.doLast {
                    logger.warn("⚠️  Sentry upload disabled")
                }
            } else if (sentryAllowFailure) {
                // Wrap in try-catch if SENTRY_ALLOW_FAILURE is set
                task.doLast {
                    if (task.state.failure) {
                        logger.warn("⚠️  Sentry upload failed but continuing (SENTRY_ALLOW_FAILURE=true): ${task.state.failure.message}")
                        task.state.failure = null
                    }
                }
            }
        }
        
        // Completely disable lintVitalRelease to prevent ExtraTranslation failures
        // The file values-b+en/strings.xml may exist in build environment from previous commits
        if (task.name == 'lintVitalRelease') {
            task.enabled = false
            task.actions.clear()
            task.doFirst {
                logger.warn("⚠️  lintVitalRelease disabled to prevent ExtraTranslation errors")
            }
        }
        
        // Also try to configure it by name as backup - multiple strategies
        try {
            def lintVitalTask = tasks.named('lintVitalRelease')
            lintVitalTask.configure {
                enabled = false
                actions.clear()
                ignoreFailures = true
            }
            lintVitalTask.get().enabled = false
            lintVitalTask.get().actions.clear()
        } catch (Exception e) {
            // Task might not exist yet, that's fine
        }
    }
}

android {
    ndkVersion rootProject.ext.ndkVersion

    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace 'com.varsithub.varsityhub'
    defaultConfig {
        applicationId 'com.varsithub.varsityhub'
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0.1"

        buildConfigField "String", "REACT_NATIVE_RELEASE_LEVEL", "\"${findProperty('reactNativeReleaseLevel') ?: 'stable'}\""
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        // Production signing config - populate via keystore.properties or environment variables
        // To create keystore: keytool -genkeypair -v -storetype PKCS12 -keystore varsityhub-release.keystore -alias varsityhub -keyalg RSA -keysize 2048 -validity 10000
        release {
            def keystorePropertiesFile = rootProject.file("keystore.properties")
            if (keystorePropertiesFile.exists()) {
                def keystoreProperties = new Properties()
                keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            } else if (System.getenv("ANDROID_KEYSTORE_PATH")) {
                // EAS Build / CI environment variables
                storeFile file(System.getenv("ANDROID_KEYSTORE_PATH"))
                storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                keyAlias System.getenv("ANDROID_KEY_ALIAS")
                keyPassword System.getenv("ANDROID_KEY_PASSWORD")
            } else {
                // Fallback to debug for local development (NOT for Play Store!)
                storeFile file('debug.keystore')
                storePassword 'android'
                keyAlias 'androiddebugkey'
                keyPassword 'android'
            }
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            signingConfig signingConfigs.release
            shrinkResources true
            minifyEnabled enableMinifyInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
            def enablePngCrunchInRelease = findProperty('android.enablePngCrunchInReleaseBuilds') ?: 'true'
            crunchPngs enablePngCrunchInRelease.toBoolean()
        }
    }
    packagingOptions {
        jniLibs {
            def enableLegacyPackaging = findProperty('expo.useLegacyPackaging') ?: 'false'
            useLegacyPackaging enableLegacyPackaging.toBoolean()
        }
    }
    androidResources {
        ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:!CVS:!thumbs.db:!picasa.ini:!*~'
    }
    lint {
        // Disable ExtraTranslation check - we've added all strings to default locale
        // This prevents build failures from stale locale-specific files
        disable 'ExtraTranslation'
        // Don't fail build on lint errors (applies to lintVitalRelease too)
        abortOnError false
        // Don't check release builds with full lint (lintVitalRelease still runs but won't fail)
        checkReleaseBuilds false
        // Ignore all lint warnings and errors for release builds
        quiet true
        ignoreWarnings true
    }
}

// Apply static values from `gradle.properties` to the `android.packagingOptions`
// Accepts values in comma delimited lists, example:
// android.packagingOptions.pickFirsts=/LICENSE,**/picasa.ini
["pickFirsts", "excludes", "merges", "doNotStrip"].each { prop ->
    // Split option: 'foo,bar' -> ['foo', 'bar']
    def options = (findProperty("android.packagingOptions.$prop") ?: "").split(",");
    // Trim all elements in place.
    for (i in 0..<options.size()) options[i] = options[i].trim();
    // `[] - ""` is essentially `[""].filter(Boolean)` removing all empty strings.
    options -= ""

    if (options.length > 0) {
        println "android.packagingOptions.$prop += $options ($options.length)"
        // Ex: android.packagingOptions.pickFirsts += '**/SCCS/**'
        options.each {
            android.packagingOptions[prop] += it
        }
    }
}

dependencies {
    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")

    def isGifEnabled = (findProperty('expo.gif.enabled') ?: "") == "true";
    def isWebpEnabled = (findProperty('expo.webp.enabled') ?: "") == "true";
    def isWebpAnimatedEnabled = (findProperty('expo.webp.animated') ?: "") == "true";

    if (isGifEnabled) {
        // For animated gif support
        implementation("com.facebook.fresco:animated-gif:${expoLibs.versions.fresco.get()}")
    }

    if (isWebpEnabled) {
        // For webp support
        implementation("com.facebook.fresco:webpsupport:${expoLibs.versions.fresco.get()}")
        if (isWebpAnimatedEnabled) {
            // Animated webp support
            implementation("com.facebook.fresco:animated-webp:${expoLibs.versions.fresco.get()}")
        }
    }

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}
