pluginManagement {
  includeBuild("$rootDir/../node_modules/expo-modules-core/expo-module-gradle-plugin")
  repositories {
    gradlePluginPortal()
    google()
    mavenCentral()
  }

  def reactNativeGradlePlugin = new File(
    providers.exec {
      workingDir(rootDir)
      commandLine("node", "--print", "require.resolve('@react-native/gradle-plugin/package.json', { paths: [require.resolve('react-native/package.json')] })")
    }.standardOutput.asText.get().trim()
  ).getParentFile().absolutePath
  includeBuild(reactNativeGradlePlugin)
}

plugins {
  id("com.facebook.react.settings")
}

reactSettings {
  // Generate autolinking config via React Native CLI
  autolinkLibrariesFromCommand()
}

dependencyResolutionManagement {
  // EAS/Expo init script injects its own Maven repo; prefer settings instead of failing on project repos.
  repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
  repositories {
    google()
    mavenCentral()
  }
}

rootProject.name = 'VarsityHub'

include ':app'
// Removed problematic expoAutolinking reference for JDK 17/Expo SDK 54 compatibility
