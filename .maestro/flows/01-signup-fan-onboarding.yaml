# Flow 1: Sign Up → Email Verify → Fan Onboarding → Enter App
#
# Prerequisites:
#   - Dev build running on device/simulator with Metro on localhost:8081
#   - Local server running with ENABLE_DEV_CODES=1
#     (verify code is returned in the API response — check server logs or Reactotron)
#   - TEST_EMAIL must be unique per run — use a + alias e.g. you+test1@gmail.com
#
# Run:
#   maestro test .maestro/flows/01-signup-fan-onboarding.yaml \
#     -e TEST_EMAIL=you+test1@gmail.com \
#     -e TEST_PASSWORD=Test1234! \
#     -e TEST_VERIFY_CODE=123456

appId: com.varsithub.varsityhub-ios
---

# ── Launch fresh ────────────────────────────────────────────────────────────────
- launchApp:
    clearState: true

# ── Handle dev client launcher ──────────────────────────────────────────────────
- runFlow:
    when:
      visible: "Development Build"
    commands:
      - tapOn: "http://localhost:8081"
      - waitForAnimationToEnd

# Dismiss dev client intro modal if shown (identified by unique "Runtime version" text)
- runFlow:
    when:
      visible: "Runtime version"
    commands:
      - tapOn: "Continue"
      - waitForAnimationToEnd

- extendedWaitUntil:
    visible: "Sign In"
    timeout: 15000

# ── Navigate to Sign Up ─────────────────────────────────────────────────────────
- tapOn:
    text: "Sign Up"

# ── Sign Up screen ──────────────────────────────────────────────────────────────
- assertVisible: "Create Account"

- tapOn:
    text: "Sign up with Email"

- tapOn:
    text: "Email"
- inputText: ${TEST_EMAIL}

- tapOn:
    text: "Password"
- inputText: ${TEST_PASSWORD}

- tapOn:
    text: "I agree to the Terms of Service and Privacy Policy"
- tapOn:
    text: "I confirm I am at least 13 years old"

- tapOn:
    text: "Sign Up"

# ── Verify Email screen ─────────────────────────────────────────────────────────
- extendedWaitUntil:
    visible: "Check Your Email"
    timeout: 10000

- tapOn:
    text: "Enter 6-digit code"
- inputText: ${TEST_VERIFY_CODE}

- tapOn:
    text: "Verify Email"

- extendedWaitUntil:
    visible: "Email verified successfully!"
    timeout: 10000

# Auto-advances to onboarding
- waitForAnimationToEnd

# ── Step 1: Role Selection — select Fan ─────────────────────────────────────────
- extendedWaitUntil:
    visible: "Fan"
    timeout: 10000

- tapOn:
    label: "Select Fan role"

- tapOn:
    label: "Continue"

# ── Step 2: Basic Info ──────────────────────────────────────────────────────────
- extendedWaitUntil:
    visible: "Username"
    timeout: 10000

- tapOn:
    text: "username"
- inputText: "testfan"

# Wait for availability check
- waitForAnimationToEnd

# Date of birth — tap field, confirm native picker with Done
- tapOn:
    text: "Date of birth"
- waitForAnimationToEnd
- tapOn:
    text: "Done"

# Continue into main app
- tapOn:
    text: "Continue"

# ── Main App ────────────────────────────────────────────────────────────────────
- extendedWaitUntil:
    visible: "Feed"
    timeout: 15000
