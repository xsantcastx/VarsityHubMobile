# Flow 3: Sign Up as Coach → Verify → Role Select → Basic Info → Org Step → Pending Screen
#
# Prerequisites:
#   - Dev build running on device/simulator with Metro on localhost:8081
#   - Local server with ENABLE_DEV_CODES=1
#   - COACH_EMAIL must be unique per run
#
# Run:
#   maestro test .maestro/flows/03-coach-onboarding-to-pending.yaml \
#     -e COACH_EMAIL=coach+test1@gmail.com \
#     -e COACH_PASSWORD=Test1234! \
#     -e TEST_VERIFY_CODE=123456

appId: com.varsithub.varsityhub-ios
---

# ── Launch fresh ────────────────────────────────────────────────────────────────
- launchApp:
    clearState: true

# ── Handle dev client launcher ──────────────────────────────────────────────────
- runFlow:
    when:
      visible: "Development Build"
    commands:
      - tapOn: "http://localhost:8081"
      - waitForAnimationToEnd

# Dismiss dev client intro modal if shown (identified by unique "Runtime version" text)
- runFlow:
    when:
      visible: "Runtime version"
    commands:
      - tapOn: "Continue"
      - waitForAnimationToEnd

- extendedWaitUntil:
    visible: "Sign In"
    timeout: 15000

# ── Navigate to Sign Up ─────────────────────────────────────────────────────────
- tapOn:
    text: "Sign Up"

- assertVisible: "Create Account"

- tapOn:
    text: "Sign up with Email"

- tapOn:
    text: "Email"
- inputText: ${COACH_EMAIL}

- tapOn:
    text: "Password"
- inputText: ${COACH_PASSWORD}

- tapOn:
    text: "I agree to the Terms of Service and Privacy Policy"
- tapOn:
    text: "I confirm I am at least 13 years old"

- tapOn:
    text: "Sign Up"

# ── Verify Email ────────────────────────────────────────────────────────────────
- extendedWaitUntil:
    visible: "Check Your Email"
    timeout: 10000

- tapOn:
    text: "Enter 6-digit code"
- inputText: ${TEST_VERIFY_CODE}

- tapOn:
    text: "Verify Email"

- extendedWaitUntil:
    visible: "Email verified successfully!"
    timeout: 10000

- waitForAnimationToEnd

# ── Step 1: Select Coach role ───────────────────────────────────────────────────
- extendedWaitUntil:
    visible: "Coach / Organizer"
    timeout: 10000

- tapOn:
    label: "Select Coach / Organizer role"

- assertVisible: "I confirm I am at least 18 years old"
- tapOn:
    text: "I confirm I am at least 18 years old"

- tapOn:
    label: "Continue"

# ── Step 2: Coach Basic Info ────────────────────────────────────────────────────
- extendedWaitUntil:
    visible: "Username"
    timeout: 10000

- tapOn:
    text: "username"
- inputText: "testcoach"

- waitForAnimationToEnd

- tapOn:
    text: "Date of birth"
- waitForAnimationToEnd
- tapOn:
    text: "Done"

- tapOn:
    text: "Continue"
- waitForAnimationToEnd

# ── Step 3: League/Org Setup ─────────────────────────────────────────────────────
- extendedWaitUntil:
    visible: "Organization"
    timeout: 10000

# ── Pending approval screen ──────────────────────────────────────────────────────
# (after submitting org form or joining existing org)
- extendedWaitUntil:
    visible: "Continue as Fan"
    timeout: 15000

- assertVisible: "Log Out"

# Confirm 30-min timeout message is NOT shown at launch
- assertNotVisible: "This is taking longer than usual"
