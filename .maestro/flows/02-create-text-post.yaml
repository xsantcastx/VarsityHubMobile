# Flow 2: Sign In → Create Text Post → Confirm Post Appears in Feed
#
# Run:
#   maestro test .maestro/flows/02-create-text-post.yaml \
#     -e TEST_ACCOUNT_EMAIL=emancero@varsityhub.app \
#     -e TEST_ACCOUNT_PASSWORD=YourPassword

appId: com.varsithub.varsityhub-ios
---

- launchApp:
    clearState: true

# Dev client launcher — always shown with clearState
- tapOn: "http://localhost:8081"

# Dev menu intro modal — dismiss it, which opens the full dev panel
- extendedWaitUntil:
    visible: "Continue"
    timeout: 20000
- tapOn: "Continue"
- waitForAnimationToEnd

# Dismiss the full dev panel by tapping the dimmed area above the sheet
- tapOn:
    point: "50%,15%"
- waitForAnimationToEnd

# ── Sign In ─────────────────────────────────────────────────────────────────────
- extendedWaitUntil:
    visible: "Sign In"
    timeout: 10000

- tapOn:
    id: "sign-in-email"
- inputText: ${TEST_ACCOUNT_EMAIL}
# Use the Next key to move focus to password field (onSubmitEditing -> passwordRef.focus())
- pressKey: Enter
- waitForAnimationToEnd
- inputText: ${TEST_ACCOUNT_PASSWORD}

- tapOn:
    text: "Sign In"
- waitForAnimationToEnd

# ── Main Feed ───────────────────────────────────────────────────────────────────
- extendedWaitUntil:
    visible: "Feed"
    timeout: 15000

# ── Navigate to Create Post ─────────────────────────────────────────────────────
- tapOn:
    text: "Create"
- waitForAnimationToEnd

# ── Type a text post ────────────────────────────────────────────────────────────
- tapOn:
    index: 0
    text: "What"
- inputText: "Maestro smoke test post"

# ── Submit ──────────────────────────────────────────────────────────────────────
- tapOn:
    text: "Post"
- waitForAnimationToEnd

# ── Confirm post appears in feed ────────────────────────────────────────────────
- extendedWaitUntil:
    visible: "Maestro smoke test post"
    timeout: 10000
