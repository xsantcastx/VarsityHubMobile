[build]
builder = "dockerfile"
dockerfilePath = "server/Dockerfile"
buildContext = "."

[deploy]
# Horizontal scaling for bursty stadium traffic (kickoff/halftime/final whistle).
# The app is stateless-friendly: rate limiting, BullMQ, distributed locks, and
# socket.io (Redis adapter) all coordinate via Redis, so replicas don't share
# in-process state. Startup-once work (scheduler reconfig, backfills) is guarded
# by runClusterOnce so it runs on a single replica only.
#
# NOTE: numReplicas increases cost and only takes effect after Railway redeploys
# this service. Requires REDIS_URL set (for cross-replica socket fanout + locks).
# The app is multi-replica-safe (Redis-coordinated sockets/locks, runClusterOnce
# for startup-once work). Kept at 1 to avoid doubling spend until load needs it;
# bump to 2 (or higher) when throughput requires horizontal scale.
numReplicas = 1

# Railway routes health probes here; an unhealthy replica is pulled from the LB.
healthcheckPath = "/health"
# Covers bounded migration retries and the optional backup schema sync.
healthcheckTimeout = 600

# Activate only after health succeeds, then stop the old writer immediately.
# The September 2026 ad-hold migration cannot mix old checkout writers with
# the new AdSlotHold inventory adapter. Keep rollback on a compatible adapter.
# In-flight requests may retry during cutover; webhook settlement is idempotent.
overlapSeconds = 0
drainingSeconds = 0

# Restart a crashed replica rather than leaving capacity down.
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
